server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ルートへのアクセスに no-cache を付与
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # .html 拡張子のファイルに no-cache を付与
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # JS, CSSなどその他のアセットはデフォルト挙動（キャッシュ制御なし）
    location / {
        try_files $uri $uri/ =404;
    }
}
